name: Release

# Builds the package and attaches it to a GitHub Release named after the
# version in package.json, the first time main carries that version. This is
# how StreamVessel consumes the fork: it installs the release asset by URL.
# Nothing is published to npm. It runs once CI (unit, bundle audit, browser
# tests) has passed on the pushed commit, so it only builds and packs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Version not yet released?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.new == 'true'
        with:
          node-version: "20"
          cache: "npm"

      - name: Build and pack
        if: steps.version.outputs.new == 'true'
        run: |
          npm ci
          npm run build
          npm pack
          # The libav binaries ship under the LGPL; a release without its text is refused.
          for variant in avbridge webcodecs; do
            tar tzf avbridge-*.tgz | grep -qx "package/vendor/libav/$variant/COPYING.LGPLv2.1"
          done

      - name: Create the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          file="avbridge-$VERSION.tgz"
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          {
            echo "Install with:"
            echo
            echo '    pnpm add https://github.com/${{ github.repository }}/releases/download/v'"$VERSION/$file"
            echo
            echo "SHA-256 \`$sha\`. Changes: see CHANGELOG.md."
          } > notes.md
          gh release create "v$VERSION" "$file" --target "$SHA" --title "v$VERSION" --notes-file notes.md
